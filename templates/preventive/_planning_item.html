{% load i18n %}{% if item.kind == "order" %}<a class="plan-chip {{ item.css }}" href="{{ item.wo.get_absolute_url }}" title="{{ item.wo.number }} · {{ item.wo.get_status_display }}">{% if item.css == "late" %}<span class="visually-hidden">{% translate "En retard" %} : </span>{% endif %}{{ item.label }}</a>{% else %}<a class="plan-chip forecast" href="{{ item.plan.get_absolute_url }}" title="{% translate 'Prévision du plan' %} {{ item.plan.code }}"><span class="visually-hidden">{% translate "Prévision" %} : </span>{{ item.label }}</a>{% endif %}
