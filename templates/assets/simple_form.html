{% extends "base.html" %}{% load i18n %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ page_title }}</h1>{% if object %}<p class="sub">{{ object }}</p>{% endif %}</div></div>
<form method="post" novalidate class="card-em" style="max-width:640px">{% csrf_token %}
  {% include "partials/_form.html" %}
  <div class="form-actions">
    <a class="btn btn-outline-secondary" href="{% url back_url_name %}">{% translate "Annuler" %}</a>
    <button class="btn btn-primary" type="submit">{% translate "Enregistrer" %}</button>
  </div>
</form>
{% endblock %}
